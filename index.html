<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d1613">
<title>Checklist de apertura · Restaurante</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <p class="eyebrow">Ahumados · Pasta · 200–300 personas</p>
    <h1>Checklist de apertura</h1>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </div>
</header>

<main class="wrap">
  <section class="summary" aria-live="polite">
    <div class="summary-row">
      <p class="lead" id="listDesc"></p>
      <p class="count"><strong id="pct">0%</strong><span id="countText"></span></p>
    </div>
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>
    <div class="tools">
      <div class="chips">
        <span class="chips" id="filters"></span>
        <select id="whoSel" class="who" aria-label="Ver las tareas de una persona"></select>
      </div>
      <div class="actions">
        <button class="btn ghost" id="resetBtn" type="button">Reiniciar lista</button>
        <button class="btn ghost" id="printBtn" type="button">Imprimir</button>
      </div>
    </div>
  </section>

  <section class="problems" id="problems" hidden>
    <h2>No funciona / hay que resolver</h2>
    <ul id="problemList"></ul>
  </section>

  <div id="sections"></div>

  <section class="people">
    <h2>Encargados</h2>
    <div class="people-list" id="peopleList"></div>
    <form class="add" id="personForm">
      <input type="text" id="personInput" placeholder="Nombre (ej. Emanuel)" aria-label="Agregar persona" maxlength="40">
      <button type="submit">Agregar persona</button>
    </form>
  </section>

  <footer class="foot">
    <div class="sync" id="sync"></div>
    <p>Copia de seguridad: <button class="link" id="exportBtn" type="button">Exportar</button> / <button class="link" id="importBtn" type="button">Importar</button></p>
    <input type="file" id="importFile" accept="application/json" hidden>
  </footer>
</main>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
