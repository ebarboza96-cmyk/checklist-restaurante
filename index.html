<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d1613">
<title>Checklist de apertura · Restaurante</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <p class="eyebrow">Ahumados · Pasta · 200–300 personas</p>
    <h1>Checklist de apertura</h1>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </div>
</header>

<main class="wrap">
  <section class="summary" aria-live="polite">
    <div class="summary-row">
      <p class="lead" id="listDesc"></p>
      <p class="count"><strong id="pct">0%</strong><span id="countText"></span></p>
    </div>
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>
    <div class="tools">
      <div class="chips" id="filters"></div>
      <div class="actions">
        <button class="btn ghost" id="resetBtn" type="button">Reiniciar lista</button>
        <button class="btn ghost" id="printBtn" type="button">Imprimir</button>
      </div>
    </div>
  </section>

  <section class="problems" id="problems" hidden>
    <h2>No funciona / hay que resolver</h2>
    <ul id="problemList"></ul>
  </section>

  <div id="sections"></div>

  <footer class="foot">
    <p>Lo que marcas se guarda solo en este dispositivo. Usa <button class="link" id="exportBtn" type="button">Exportar</button> / <button class="link" id="importBtn" type="button">Importar</button> para pasarlo a otro teléfono.</p>
    <input type="file" id="importFile" accept="application/json" hidden>
  </footer>
</main>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
